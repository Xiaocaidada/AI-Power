[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-power-sdk"
version = "0.1.0"
description = "Typed Python client for the AI Power platform"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["ai_power_sdk"]