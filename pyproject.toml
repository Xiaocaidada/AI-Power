[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-power"
version = "0.1.0"
description = "AI platform: multi-provider chat + RAG knowledge base (P0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "uuid6>=2024.7.10",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]