services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai_power
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ai_power
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_power -d ai_power"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_power:${POSTGRES_PASSWORD}@postgres:5432/ai_power
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-180}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-10}
      AGENT_TOOL_OUTPUT_MAX_CHARS: ${AGENT_TOOL_OUTPUT_MAX_CHARS:-4000}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-90}
      WORKFLOW_NODE_TIMEOUT_SECONDS: ${WORKFLOW_NODE_TIMEOUT_SECONDS:-120}
      WORKFLOW_NODE_ATTEMPTS: ${WORKFLOW_NODE_ATTEMPTS:-2}
      WORKFLOW_MAX_NODES: ${WORKFLOW_MAX_NODES:-20}
      WORKFLOW_PARALLEL_LIMIT: ${WORKFLOW_PARALLEL_LIMIT:-3}
      COLLABORATION_MAX_TASKS: ${COLLABORATION_MAX_TASKS:-4}
      COLLABORATION_MAX_ROUNDS: ${COLLABORATION_MAX_ROUNDS:-2}
      COLLABORATION_MAX_STEPS: ${COLLABORATION_MAX_STEPS:-16}
      COLLABORATION_PARALLEL_LIMIT: ${COLLABORATION_PARALLEL_LIMIT:-3}
      COLLABORATION_TASK_TIMEOUT_SECONDS: ${COLLABORATION_TASK_TIMEOUT_SECONDS:-180}
      QUOTA_FREE_DAILY_COST_USD: ${QUOTA_FREE_DAILY_COST_USD:-1}
      QUOTA_PRO_DAILY_COST_USD: ${QUOTA_PRO_DAILY_COST_USD:-50}
      BUDGET_WEBHOOK_URL: ${BUDGET_WEBHOOK_URL:-}
      RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-20}
      RETRIEVAL_HYBRID_ENABLED: ${RETRIEVAL_HYBRID_ENABLED:-true}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://192.168.29.100:8001/v1}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-bge-reranker-v2-m3}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-10}
      RERANK_MAX_CANDIDATES: ${RERANK_MAX_CANDIDATES:-8}
      RERANK_MAX_DOC_CHARS: ${RERANK_MAX_DOC_CHARS:-800}
    ports:
      - "8002:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_power:${POSTGRES_PASSWORD}@postgres:5432/ai_power
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-180}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-90}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["arq", "app.worker.WorkerSettings"]

  web:
    build:
      context: ./web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  backup:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: ai_power
      PGDATABASE: ai_power
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - backups:/backups
      - ./scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/bin/backup_postgres.sh"]

  prometheus:
      image: prom/prometheus:latest
      profiles: ["observability"]
      volumes:
        - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      ports:
        - "9090:9090"
      depends_on:
        api:
          condition: service_healthy

  caddy:
      image: caddy:2-alpine
      profiles: ["https"]
      environment:
        CADDY_DOMAIN: ${CADDY_DOMAIN:-}
      volumes:
        - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
        - caddy_data:/data
        - caddy_config:/config
      ports:
        - "80:80"
        - "443:443"
      depends_on:
        - web

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
